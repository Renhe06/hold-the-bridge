<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<base href="/" />
<title>shot harness</title>
<style>html,body{margin:0;background:#000}</style>
</head>
<body>
<!--
  ============================================================
   截图夹具（只在开发时用，不参与线上）
   目的：headless Edge 里拍真实画面。本环境没有交互式浏览器，
        之前只能靠冒烟断言 + 图标 PNG 猜画面，这个夹具补上"看"的能力。

   做法：
   1) 先把 requestAnimationFrame 换成"收集回调不执行"，主循环就完全由
      脚本用虚拟时钟驱动 → 同一场景每次拍出来一模一样，能对比改前改后。
   2) 把真 index.html 的 head/body 注入进来（去掉 <script>），
      保证夹具的 DOM 与线上完全一致，不会出现"夹具里好好的、线上白屏"。
   3) 再用脚本摆场景，最后走两帧真 RAF 让合成器提交一次，然后截图。

   用法（workdir = hold-the-bridge）：
     msedge --headless=new --disable-gpu --virtual-time-budget=15000 ^
       --window-size=390,844 --screenshot=shots/demo.png ^
       "http://127.0.0.1:8123/tools/shot.html?scene=demo&frames=90"
   场景见下方 SCENES。
  ============================================================
-->
<script type="module">
const Q = new URLSearchParams(location.search);
// 出错了别只给一张黑图：把异常直接写在画面上，截图就能读到
window.addEventListener('error', (ev) => {
  const d = document.createElement('pre');
  d.style.cssText = 'position:fixed;left:0;top:0;right:0;z-index:99999;background:#300;color:#ffb3b3;font:13px monospace;padding:10px;white-space:pre-wrap';
  d.textContent = 'SHOT ERROR\n' + (ev.error && ev.error.stack ? ev.error.stack : ev.message);
  document.body.appendChild(d);
});
const rafQ = [];
const realRAF = window.requestAnimationFrame.bind(window);
window.requestAnimationFrame = (cb) => { rafQ.push(cb); return rafQ.length; };

// ---- 1. 注入真 DOM（去掉脚本标签，否则会二次初始化）----
const html = await (await fetch('/index.html')).text();
const doc = new DOMParser().parseFromString(html, 'text/html');
const strip = (s) => s.replace(/<script[\s\S]*?<\/script>/gi, '');
document.head.insertAdjacentHTML('beforeend', strip(doc.head.innerHTML));
document.body.insertAdjacentHTML('beforeend', strip(doc.body.innerHTML));

// ---- 2. 起游戏（main.js 一加载就 fit() 并把 frame 挂进 rafQ）----
await import('/js/main.js');
const H = window.__HBT;
const { game, cam, renderer, frame, STATE } = H;
const { CFG, setLevel } = await import('/js/config.js');
// 按皮肤名选关（?skin=fantasy），比写死下标稳 —— 关卡数组往后还会加
// 注意：main.js 的启动进度条自己也吃 rAF，主循环要等它走完才挂进来。
// 所以摆场景之前必须先空跑一段（默认 320 帧），否则截图就是一张没画过的黑画布。
function runSkin() {
  step(+(Q.get('warm') || 320));
  const skin = Q.get('skin');
  if (!skin) return;
  const i = CFG.levels.findIndex((l) => l.skin === skin);
  if (i >= 0) game.newRun(i);
  game.state = STATE.FIGHT;
}

// ---- 3. 虚拟时钟 ----
let t = 1000;
function step(n, dtMs = 16.7) {
  for (let i = 0; i < n; i++) {
    const cb = rafQ.shift();
    t += dtMs;
    if (cb) cb(t);
  }
}
function clearEnemies() {
  game.enemies.length = 0;
  game.spawnQueue.length = 0;
  game.bullets.length = 0;
}
/** 摆一只指定敌人，返回它的投影尺寸（用来量化"太小了"到底多小）*/
function put(kind, x, z, hpMul = 1) {
  game.spawnEnemy(kind);
  const e = game.enemies[game.enemies.length - 1];
  e.x = x; e.z = z; e.hp *= hpMul; e.maxHp = e.hp;
  e.state = 'rest';
  return e;
}

// 模型拍摄模式：不开火、不飙血、不自动补怪、不画英雄 —— 否则每张特写都被受击白闪糊住
function studio() {
  renderer._drawHero = () => {};
  const gu = game.update.bind(game);
  game.update = (dt) => {
    gu(dt);
    game.bullets.length = 0;
    game.particles.length = 0;
    game.spawnQueue.length = 0;
    for (const en of game.enemies) { en.hurtT = 0; en.burnT = 0; en.slowT = 0; }
  };
}

const SCENES = {
  start: () => { step(4); },
  play: () => { game.newRun(); step(+(Q.get('frames') || 300)); },

  // 手工摆一排敌人，专门量体型和辨识度
  demo: () => {
    game.newRun();
    game.state = STATE.FIGHT;
    clearEnemies();
    put('walker', -0.20, 13);
    put('walker', 0.22, 16);
    put('runner', -0.06, 19);
    put('brute', 0.18, 22);
    put('boss', 0, 30);
    step(+(Q.get('frames') || 40));
  },

  // 打到第 n 波：直方图式看难度手感（敌人从雾里走出来）
  wave: () => {
    game.newRun();
    const n = +(Q.get('n') || 3);
    game.wave = n - 1;
    game.state = STATE.FIGHT;
    game.startWave();
    step(+(Q.get('frames') || 360));
  },

  // 贴脸肉搏：敌人已经在桥头，看扑击动作和血条区
  melee: () => {
    game.newRun();
    game.state = STATE.FIGHT;
    clearEnemies();
    put('walker', -0.16, 10.6);
    put('walker', 0.14, 10.7);
    put('walker', 0.0, 11.0);
    put('brute', -0.2, 11.3);
    step(+(Q.get('frames') || 30));
  },

  // 单只模型特写：?scene=unit&skin=fantasy&kind=walker&z=10.6&phase=0.9
  // 用来对着"改前 / 改后"逐只比对，phase 固定才能看出走路姿势的差别
  unit: () => {
    runSkin();
    studio();
    game.state = STATE.FIGHT;
    clearEnemies();
    const e = put(Q.get('kind') || 'walker', +(Q.get('x') || 0), +(Q.get('z') || 10.6));
    e.phase = +(Q.get('phase') || 0);
    step(+(Q.get('frames') || 2));
  },

  // 一屏摆齐这一关的怪：?scene=lineup&skin=fantasy
  lineup: () => {
    runSkin();
    studio();
    game.state = STATE.FIGHT;
    clearEnemies();
    const kinds = (Q.get('kinds') || 'walker,runner,brute,spitter,splitter,boss').split(',');
    const ph = +(Q.get('phase') || 0.9);
    kinds.forEach((k, i) => {
      const row = Math.floor(i / 3);
      const x = (i % 3 - 1) * 0.30;
      const e = put(k, x, row ? 17.5 : 11.8);
      e.phase = ph + i * 0.7;
    });
    step(2);
  },

  // 这一关的真实战场：?scene=field&skin=fantasy&n=3
  field: () => {
    runSkin();
    game.state = STATE.FIGHT;
    clearEnemies();
    game.wave = +(Q.get('n') || 3) - 1;
    game.startWave();
    step(+(Q.get('frames') || 300));
  },

  // 选关界面：?scene=levels —— 遮罩在文件末尾单独挂回来（见 clean 之后那段）
  levels: () => { step(4); },

  over: () => {
    game.newRun();
    game.score = 1280; game.wave = 9; game.kills = 137;
    game.gameOver();
    step(4);
  },
};

(Q.get('scene') in SCENES ? SCENES[Q.get('scene')] : SCENES.play)();

// ---- 4. 报告：写成表格挂进 DOM，配 --dump-dom 就能数字复核 ----
const rows = [];
for (const e of game.enemies) {
  const s = cam.scaleAt(e.z);
  rows.push(`${e.kind.padEnd(6)} z=${e.z.toFixed(1)} x=${e.x.toFixed(2)} ` +
    `世界=${e.size} 屏幕高=${(e.size * s).toFixed(0)}px 半宽=${(e.halfW * s).toFixed(1)}px`);
}
const px = cam.scaleAt(10);
rows.push(`-- 桥头处 1 世界单位 = ${px.toFixed(0)}px，桥面全宽 = ${(2 * cam.roadHalf * px).toFixed(0)}px（画布宽 ${cam.w}）`);
rows.push(`-- 画布 ${cam.w}x${cam.h} dpr=${renderer.dpr} roadHalf=${cam.roadHalf.toFixed(3)} scaleNear=${cam.scaleNear.toFixed(0)}`);
const pre = document.createElement('pre');
pre.id = 'report';
pre.style.cssText = 'position:fixed;left:0;top:0;z-index:-1;color:#0f0;font:11px monospace;white-space:pre';
pre.textContent = rows.join('\n');
document.body.appendChild(pre);

// 拍"纯画面"用：?clean=1 把所有 .overlay 的 .show 摘掉。
// main.js 是照真流程启动的，所以首次访问会自动弹说明、首页遮罩也挂着；
// 想只看桥面和尸群就带这个参数（不影响游戏逻辑，只是截图前藏掉 DOM 弹窗）。
if (Q.get('clean')) {
  document.querySelectorAll('.overlay.show').forEach((n) => n.classList.remove('show'));
  const boot = document.getElementById('bootOverlay');
  if (boot) boot.style.display = 'none';
}

// 选关界面（?scene=levels）：先把启动遮罩摘干净，再单独把 levelOverlay 挂回来。
// 不能靠 clean=1 —— 那段会把刚加的 show 一起摘掉。
if (Q.get('scene') === 'levels') {
  document.querySelectorAll('.overlay.show').forEach((n) => n.classList.remove('show'));
  const boot = document.getElementById('bootOverlay');
  if (boot) boot.style.display = 'none';
  const lv = document.getElementById('levelOverlay');
  if (lv) {
    lv.classList.add('show');
    // .overlay.show 自带 overlayIn 淡入动画；无头虚拟时钟不推进 CSS animation，
    // 截图会停在半透明中间态。取图时直接钉死终态（只影响夹具，不碰线上样式）。
    lv.style.animation = 'none';
    lv.style.opacity = '1';
    lv.style.transform = 'none';
  }
}

// 让合成器提交一帧（真实 RAF），截图才有内容
await new Promise((r) => realRAF(() => realRAF(r)));
document.title = 'ready';
</script>
</body>
</html>
