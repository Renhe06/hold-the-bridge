<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>跃 · 上篇 —— 守桥</title>
<script>
// 无头环境看不到 console，把未捕获错误直接写进 report / title
window.addEventListener('error', (e) => {
  const msg = `ERR ${e.message} @ ${(e.filename || '').split('/').pop()}:${e.lineno}`;
  document.title = msg;
  const r = document.getElementById('report');
  if (r) { r.classList.add('on'); r.textContent = msg; }
});
</script>
<style>
  html, body { margin: 0; height: 100%; background: #04090d; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; }

  /* ---- 唯一 HUD：氧气。没有分数、没有血条、没有连击 ---- */
  #hud {
    position: fixed; left: 0; right: 0; top: max(56px, calc(env(safe-area-inset-top) + 44px));
    z-index: 5; pointer-events: none; text-align: center;
    font-family: -apple-system, "PingFang SC", sans-serif;
    transition: opacity 1.4s ease;
  }
  /* 顶部压一层暗：浅水里背景是亮的，纯文字会直接糊掉 */
  #hud::before {
    content: ''; position: fixed; left: 0; right: 0; top: 0; height: 230px;
    background: linear-gradient(to bottom, rgba(2,9,15,.78) 0%, rgba(2,9,15,.34) 58%, rgba(2,9,15,0) 100%);
    pointer-events: none;
  }
  /* ::before 是 fixed 定位，会盖住普通流的兄弟节点。
     不给文字单独提层，HUD 就会被自己那层渐变压在下面 —— 表现是"字在，但看不清"。 */
  #hud > div { position: relative; z-index: 1; }
  #hud.off { opacity: 0; }
  #hud .wave {
    font-size: 11.5px; letter-spacing: 0.30em; text-indent: 0.30em;
    color: #b6d6e4; text-shadow: 0 1px 7px rgba(0,0,0,1);
  }
  #hud .oxy {
    margin-top: 4px;
    font: 300 36px/1 ui-monospace, "SF Mono", monospace;
    font-variant-numeric: tabular-nums;
    color: #a6e7f7; letter-spacing: 0.04em;
    text-shadow: 0 2px 14px rgba(60,180,220,.4), 0 1px 5px rgba(0,0,0,.95);
    transition: color .3s ease;
  }
  #hud .oxy i { font-style: normal; font-size: 15px; opacity: .62; margin-left: 3px; }
  /* ---- 血条：第二条命 ----
     用户要"给鲸鱼加一个血条"。它不是装饰：钩子持续扣、塑料和核废水一次扣，
     扣到 0 就沉底。所以它必须比氧气**细**、比氧气**靠下** ——
     读的顺序是"气还有多少秒（大字）→ 血还剩多少（细条）"。
     宽度和氧气数字对齐（132px），一眼能看出本局还剩几条命。 */
  #hud .hp {
    width: 140px; height: 4px; margin: 10px auto 0;
    background: rgba(255,150,140,.16);
    box-shadow: inset 0 0 0 1px rgba(255,170,160,.18);
    border-radius: 2px; overflow: hidden;
    transition: opacity .3s ease;
  }
  #hud .hp i {
    display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg, #b83c34, #ff8f7a);
    box-shadow: 0 0 8px rgba(255,110,96,.5);
    transition: width .22s ease, background .3s ease;
  }
  #hud .hp.low i { background: linear-gradient(90deg, #6e1a17, #d8402f); }
  #hud .hp.hit { animation: hpflash .34s ease; }
  @keyframes hpflash {
    0% { transform: scaleY(1); filter: brightness(2.4); }
    100% { transform: scaleY(1); filter: brightness(1); }
  }
  #hud .band {
    margin-top: 7px; font-size: 10.5px; letter-spacing: .2em; color: #7fa8ba;
    opacity: 0; transition: opacity .35s ease;
  }
  #hud .band.on { opacity: 1; }
  #hud .obj {
    margin-top: 9px; font-size: 12.5px; letter-spacing: .16em;
    color: #86b3c6; text-shadow: 0 1px 6px rgba(0,0,0,.95);
  }

  /* ---- 开场三步：只教三个动作，多一个都不教 ---- */
  #tut {
    position: fixed; left: 50%; bottom: 21%; transform: translateX(-50%);
    z-index: 7; pointer-events: none; width: 260px; height: 26px;
    opacity: 0; transition: opacity .5s ease;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  #tut.on { opacity: 1; }
  #tut .step {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    white-space: nowrap; font-size: 15px; letter-spacing: .3em; text-indent: .3em;
    color: #d3ecf7; opacity: 0; transition: opacity .45s ease;
    text-shadow: 0 2px 12px rgba(0,0,0,.95);
  }
  #tut .step.on { opacity: 1; }

  /* ---- 底部提示 ---- */
  #hint {
    position: fixed; left: 0; right: 0; bottom: max(13%, 74px); z-index: 5;
    text-align: center; pointer-events: none;
    font: 400 13px/1.6 -apple-system, "PingFang SC", sans-serif;
    color: #9fd0e4; letter-spacing: 0.08em;
    text-shadow: 0 1px 6px rgba(0,0,0,.95);
    opacity: 0; transition: opacity .4s ease;
  }
  #hint.on { opacity: .92; }

  /* ---- 长按进度：回应 / 献祭共用一条 ---- */
  #prog {
    position: fixed; left: 50%; bottom: max(9%, 52px); transform: translateX(-50%);
    width: 132px; height: 2px; z-index: 5; pointer-events: none;
    background: rgba(140,200,220,.16); border-radius: 2px; opacity: 0;
    transition: opacity .2s ease;
  }
  #prog.on { opacity: 1; }
  #prog i { display: block; height: 100%; width: 0; border-radius: 2px;
    background: #8fd8ec; box-shadow: 0 0 8px rgba(140,220,240,.7); }

  /* ---- 标题 ---- */
  #boot {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 13px;
    background: radial-gradient(120% 80% at 50% 32%, #0b2b3c, #03070c 78%) #04090d;
    color: #cfeaf7; font: 400 15px/1.7 -apple-system, "PingFang SC", sans-serif;
    letter-spacing: 0.06em; cursor: pointer;
  }
  #boot b { font-weight: 400; font-size: 44px; letter-spacing: 0.3em; text-indent: .3em; }
  #boot .sub { color: #6f93a6; font-size: 12.5px; letter-spacing: 0.14em; }
  #boot .rule { width: 34px; height: 1px; background: rgba(140,190,210,.3); margin: 3px 0; }
  #boot .go { margin-top: 10px; font-size: 12px; letter-spacing: .3em; color: #86b9cd;
    border: 1px solid rgba(134,185,205,.3); padding: 9px 22px; border-radius: 30px; }

  /* 返回选关：只在标题页和结局出现，游戏进行中藏起来（别让手指误触） */
  #back {
    position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom) + 18px);
    z-index: 12; padding: 7px 13px; border-radius: 20px;
    border: 1px solid rgba(140, 190, 210, 0.22);
    color: #8fb6c8; font: 400 11.5px/1 -apple-system, "PingFang SC", sans-serif;
    letter-spacing: .18em; text-decoration: none; background: rgba(4, 14, 20, .55);
    opacity: 0; pointer-events: none; transition: opacity .5s ease;
  }
  #back.on { opacity: .78; pointer-events: auto; }

  /* ---- 波次过渡 / 结局 ---- */
  #veil {
    position: fixed; inset: 0; z-index: 8; pointer-events: none;
    /* 文字落在画面下 1/3：上面是水母和珊瑚、中间是鲸，底下那片黑海床才是
       "空白" —— 居中的话正好压在鲸身上，两样都看不清（v1.0.74 实拍）。 */
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 10px; text-align: center; opacity: 0; transition: opacity .7s ease;
    font-family: -apple-system, "PingFang SC", sans-serif;
    /* 9vh：鲸沉到珊瑚里之后，它的头正好在 0.62~0.72h —— 13vh 的标题
       会压在上面。再往下让开半个身位，同时不撞到左下角的返回键。 */
    color: #d7eef8; padding: 0 34px 9vh;
  }
  #veil.on { opacity: 1; }
  #veil .t { font-size: 21px; letter-spacing: .18em; }
  /* pre-line：文案里的 \n 是硬换行。默认 white-space 会把它折叠成空格，
     于是"珊瑚是彩色的。\n那是第一层的样子"会挤成一行再自动折断 —— 断在小标题腰上。 */
  #veil .d { font-size: 12.5px; line-height: 1.9; color: #7ea6b8; letter-spacing: .08em; white-space: pre-line; }
  #veil .k { font-size: 10px; letter-spacing: .26em; color: #5d8496; margin-top: 18px; }

  /* ---- 每波的歌词：开场两秒，然后交给玩家 ---- */
  #lyric {
    position: fixed; left: 0; right: 0; top: 30%; z-index: 6; text-align: center;
    pointer-events: none; opacity: 0; transition: opacity 1.1s ease;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  #lyric.on { opacity: 1; }
  #lyric .t {
    font-size: 15px; letter-spacing: 0.36em; text-indent: 0.36em;
    color: #cfe8f4; text-shadow: 0 2px 14px rgba(0,0,0,.9);
  }
  #lyric .d {
    margin-top: 9px; font-size: 10.5px; letter-spacing: 0.14em;
    color: #92b8c9; text-shadow: 0 1px 8px rgba(0,0,0,.95);
  }

  /* 歌的进度：七个点。它也是唯一的"进度条" —— 没有关卡号，只有音。 */
  #hud .notes { display: flex; gap: 7px; justify-content: center; margin-top: 10px; }
  #hud .notes i {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(150, 206, 226, 0.30);
    transition: background .55s ease, box-shadow .55s ease;
  }
  #hud .notes i.on { background: #c4ecf8; box-shadow: 0 0 9px rgba(158, 228, 248, 0.8); }

  #report {
    position: fixed; left: 0; bottom: 0; z-index: 9; margin: 0; padding: 4px 8px;
    color: #7fe3ff; font: 11px/1.5 ui-monospace, monospace; white-space: pre;
    background: rgba(0, 0, 0, 0.45); display: none; max-width: 100vw;
  }
  #report.on { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="wave" id="hWave"></div>
  <div class="oxy" id="hOxy">30<i>s</i></div>
  <div class="hp" id="hHp"><i></i></div>
  <div class="notes" id="hNotes"></div>
  <div class="obj" id="hObj">目标 · 找到同伴</div>
  <div class="band" id="hBand">水面 · 能被看见</div>
</div>
<div id="tut">
  <div class="step">往下滑 · 下潜</div>
  <div class="step">往上滑 · 出水换气</div>
  <div class="step">长按 · 唱</div>
</div>
<div id="hint"></div>
<div id="lyric"><div class="t"></div><div class="d"></div></div>
<div id="prog"><i></i></div>
<div id="veil"><div class="t"></div><div class="d"></div><div class="k"></div></div>
<a id="back" class="on" href="index.html">← 选关</a>
<pre id="report"></pre>

<div id="boot">
  <b>跃</b>
  <div class="rule"></div>
  <div class="sub">上篇 · 一次下潜</div>
  <div class="sub" style="opacity:.62;margin-top:6px">往下滑 · 下潜　　往上滑 · 出水换气</div>
  <div class="sub" style="opacity:.44;margin-top:14px;font-size:10.5px;line-height:1.9">
    找到同伴 → 歌多一个音<br>气只在海面回满
  </div>
  <div class="go">开始</div>
</div>

<script type="module">
import { SeaRenderer } from './js/sea-render.js';
import { SeaAudio } from './js/sea-audio.js';
import { SeaWhale } from './js/sea-whale.js';
import { SeaGame, SEA_STRATA } from './js/sea-game.js';
import { Sound } from './js/audio.js';
import { QUALITY, LEVELS } from './js/quality.js';
import { clamp } from './js/util.js';

const Q = new URLSearchParams(location.search);
const cv = document.getElementById('cv');
const boot = document.getElementById('boot');
const report = document.getElementById('report');
const elWave = document.getElementById('hWave');
const elHud = document.getElementById('hud');
const elOxy = document.getElementById('hOxy');
const elHp = document.getElementById('hHp');
const elHpBar = elHp.firstElementChild;
const elBand = document.getElementById('hBand');
const elObj = document.getElementById('hObj');
const elTut = document.getElementById('tut');
const tutSteps = [...elTut.children];
const elHint = document.getElementById('hint');
const elNotes = document.getElementById('hNotes');
const elLyric = document.getElementById('lyric');
const elProg = document.getElementById('prog');
const elProgBar = elProg.firstElementChild;
const elVeil = document.getElementById('veil');
const elBack = document.getElementById('back');

const qName = Q.get('q');
if (qName) {
  const i = LEVELS.findIndex((l) => l.name === qName);
  if (i >= 0) QUALITY.force(i);
}
QUALITY.auto = false;

const r = new SeaRenderer(cv);
const S = new Sound();
const sea = new SeaAudio(S);
const whaleArt = new SeaWhale();

// 占位精灵：把矢量鲸画进透明画布再喂回同一条贴图管线（验证用，不是最终美术）
function makeMockSprite() {
  const W = 1200, H = 800;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const tmp = new SeaRenderer(c, { alpha: true });
  tmp.w = W; tmp.h = H; tmp.dpr = 1;
  tmp.ctx.setTransform(1, 0, 0, 1, 0, 0);
  tmp.ctx.clearRect(0, 0, W, H);
  tmp.drawWhale(W * 0.5, H * 0.46, W * 0.94, { tilt: 0, phase: 1.2, depth: 0.4, silhouette: false });
  return c;
}

// 贴图默认就加载。之前默认是空串，从选关面板进来（没有 ?sprite=img）就一路走矢量兜底，
// 玩家看到的是一头纯黑的鱼 —— 「鱼的贴图没生效」就是这么来的。
// ?sprite=mock 仍然是假图（单测用），?sprite=vec 才强制走矢量。
const spriteMode = Q.get('sprite') || 'img';
if (spriteMode === 'mock') {
  whaleArt.adopt(makeMockSprite());
} else if (spriteMode === 'img') {
  whaleArt.load('img/sea/').then((ok) => {
    if (!ok && report) {
      report.classList.add('on');
      report.textContent = 'img/sea/ 下没有找到 whale，已退回矢量占位';
    }
  });
}

const FROZEN = Q.get('frozen') === '1';
let t = 0;
let running = false;
let last = 0;
let frames = 0;
let fpsAcc = 0, fpsN = 0, fpsShown = 0;
// 这两个必须在任何 syncDom 之前就存在：selftest / auto 分支会同步调 syncDom，
// 声明晚一行就是 TDZ 报错（曾把整页打成 "ERR ... before initialization"）。
let endShown = '';
let lyricT = 0;
let lastStrata = '';
let lastHp = 1000;   // 上一次画出来的血量（千分位），用来判断"这一帧要不要闪"

const game = new SeaGame(r, sea, whaleArt);
// 截图用：?gulls=N 直接把 N 只海鸥放进天上（真实游玩由暴露度决定数量）
if (Q.get('gulls')) {
  const n = Math.max(0, Math.min(9, parseInt(Q.get('gulls'), 10) || 0));
  for (let i = 0; i < n; i++) {
    game.gulls.push({ lat: (i / Math.max(1, n)) * 2 - 1, ph: i * 1.3, r: 0.14 + (i % 3) * 0.05, sp: 0.6 });
  }
}

// 调试/截图现在只需要 ?depth=0.62 —— 世界是连续的，没有"跳到第几波"
if (Q.get('depth') != null) {
  game.depth = clamp(parseFloat(Q.get('depth')), -0.3, 1);
  game.aimDepth = game.depth;
}
if (Q.get('oxy') != null) game.oxy = clamp(parseFloat(Q.get('oxy')), 0, 1);
// 调试：?hp=0.4 按**比例**设血量（0~1），内部乘血条上限；?god=1 关掉一切伤害
if (Q.get('hp') != null) game.hp = clamp(parseFloat(Q.get('hp')), 0, 1) * game.hpMax;
if (Q.get('god') === '1') game.god = true;
// 调试：直接摆出伤痕状态（截图核对血痕 / 变异 / 塑料袋的位置）
if (Q.get('scars') != null) game.scars = Math.min(6, parseInt(Q.get('scars'), 10) || 0);
if (Q.get('mut') != null) game.mut = Math.min(3, parseInt(Q.get('mut'), 10) || 0);
if (Q.get('rings') != null) game.plasticRings = Math.min(4, parseInt(Q.get('rings'), 10) || 0);
// 调试：?codex=5 直接标记前 N 只已被回应（验证"跃出去 = 回去"这个结局）
if (Q.get('codex') != null) {
  const n = Math.max(0, Math.min(6, parseInt(Q.get('codex'), 10) || 0));
  for (let i = 0; i < game.mates.length && i < n; i++) {
    game.mates[i].answered = true;
    game.mates[i].found = true;
    game.codex.push({ name: '', depth: game.mates[i].depth, voice: i + 2 });
  }
  game.voices = Math.min(7, 1 + n);
}
// 调试：?dives=N 直接把世界推到第 N 阶段（海面对比截图用）
if (Q.get('dives') != null) game.dives = Math.max(0, parseInt(Q.get('dives'), 10) || 0);
// 调试：?vision=1 直接进幻象（花园截图用）
if (Q.get('vision') === '1') { game.mode = 'vision'; game.visionT = 2.5; game.visionK = 1; }

function fit() {
  const w = Math.max(240, window.innerWidth);
  const h = Math.max(320, window.innerHeight);
  const dpr = Q.get('q') ? Math.min(window.devicePixelRatio || 1, QUALITY.prop.dpr) : Math.min(window.devicePixelRatio || 1, 2.5);
  r.resize(w, h, dpr);
}
fit();
window.addEventListener('resize', () => {
  fit();
  // resize 会清空 canvas。截图夹具必须自己补一帧，
  // 否则无头浏览器在拍之前触发一次 resize，拍到的就是纯黑。
  if (FROZEN) drawOnce();
  else if (Q.get('auto')) { try { r.frame(1 / 60, frameState()); } catch (_) {} }
});

function frameState() {
  const w = r.w, h = r.h;
  return {
    camDepth: game.depth,
    echo: game.echo,
    // 世界在慢慢死：海雪、浮游生物、光柱都按这一条曲线递减
    life: game.life,
    murk: game.murk,
    vision: game.visionK,
    dim: game.dark,
    // 缺氧：氧气低于 35% 开始收视野，越低收得越狠
    panic: game.oxy < 0.35 ? (0.35 - game.oxy) / 0.35 : 0,
    // 第 3 波沉船是主角，抬亮它
    shipBoost: game.kit.some((k) => k.type === 'wreck') ? 1 : 0,
    whale: {
      x: w * (0.5 + game.lat * 0.42),
      // 跃出水面时整条鲸往上抬：相机跟着走，但身体要比水面先出去，
      // 否则看起来是"水面沉下去"，不是"我跃起来"。
      // 沉底那一段额外往下掉 0.30 屏（sinkDrop）—— 死后的身体是**沉**下去的，
      // 不是镜头往下摇过去的，这两件事在画面上完全不同。
      y: h * (0.53 + Math.min(0, game.depth) * 0.60 + (game.sinkDrop || 0)),
      // 0.80 屏宽：贴图整图宽 1.05 时鲸本体占 0.75 屏，画面里只剩鲸、看不到环境。
      // 这一关要读的是"水和同类"，不是角色立绘。
      L: w * 0.80,
      // 下潜时头朝下：倾角直接读垂直速度，比按目标位置算更有"受力"的感觉。
      // 沉底那一段是**翻肚皮**：tilt 转到 π（180°），同时 flip 镜像回来 ——
      // 两个变换的合成是"关于横轴翻转"，也就是头还在右边、肚皮朝上。
      // 只转 180° 不镜像的话，头会跑到左边，看起来像"倒着游"而不是"死了"。
      tilt: (() => {
        const roll = game.deadRoll || 0;
        if (roll > 0) {
          // 翻转过程中把"活着时的倾斜"淡出：不能让它在 0.30 的低头角度上再叠 180°
          const live = clamp(game.vD * 0.13, -0.42, 0.42) + Math.sin(t * 0.31) * 0.012;
          return live * (1 - roll) + Math.PI * roll;
        }
        return clamp(game.vD * 0.13, -0.42, 0.42) + Math.sin(t * 0.31) * 0.012;
      })(),
      // 过了竖直（π/2）再镜像：那一刻鲸是竖着的，左右对称，切换看不出跳变
      flip: (game.deadRoll || 0) > 0.5,
      phase: t * 2.62,
      // 这一条之前漏了：海水把它泡到多深，它就该多暗。
      // 漏掉的后果是主角在 1.00 深处依然又蓝又亮，整个"深渊"塌了。
      // 结局压暗也要吃到主角身上：dark 会折算成等效深度，
      // 否则全世界都黑了，只剩它亮着 —— 那是灯，不是鲸。
      depth: clamp(game.depth + game.dark * 0.75, 0, 1),
      // 伤：血痕 / 核变异 / 尾上的塑料袋。三个数字全是"环境留在它身上的账"，
      // 贴图层按这三个数去烘伤痕，状态不变就不重画。
      scars: game.scars,
      mut: game.mut,
      rings: game.plasticRings,
    },
    // 水面之上时改到实体层之后画：不然跃出去的那一下会被远处的城市盖住
    lateWhale: game.depth < 0.12,
    // 沉底与幻象：鲸落到珊瑚丛里，被枝梢接住 —— 顺序换了，不是把它调透明
    whaleBehind: game.mode === 'sinking' || game.mode === 'vision' || game.mode === 'endB',
    sprite: whaleArt,
    // 海床上的东西（骨架 → 珊瑚）单独一层，画在鲸之前
    bedLayer: (ctx, R) => game.drawBedLayer(ctx, R),
    entities: (ctx, R) => game.drawEntities(ctx, R),
  };
}

function drawOnce() {
  r.frame(0, frameState());
  // 静态取图时也要把 HUD / 歌词刷出来，否则截图里只有一片水
  syncDom();
  paintVeil();
}

if (Q.get('bench') === '1') {
  const N = 30;
  const t0 = performance.now();
  for (let i = 0; i < N; i++) r.frame(1 / 60, frameState());
  const ms = (performance.now() - t0) / N;
  report.classList.add('on');
  report.textContent = `bench: frame() ${ms.toFixed(2)}ms/帧（软件光栅，真机 GPU 更快）`;
}

if (Q.get('selftest') === '1') {
  report.classList.add('on');
  boot.style.display = 'none';
  running = true;
  S.unlock();
  const ok = sea.init();
  const q = QUALITY.prop;
  report.textContent = [
    `selftest ok=${ok} ready=${sea.ready} mode=${game.mode} depth=${game.depth.toFixed(2)}`,
    `quality=${q.name} dpr=${q.dpr} haze=${q.haze} fog=${q.fog} motes=${q.motes}`,
    `canvas=${cv.width}x${cv.height} css=${r.w}x${r.h}`,
    `kit=${game.kit.length} mates=${game.mates.length} voices=${game.voices}`,
  ].join('\n');
  if (FROZEN) drawOnce();
}

if (FROZEN) {
  boot.style.display = 'none';
  running = true;
  requestAnimationFrame(() => { drawOnce(); try { S.unlock(); sea.init(); } catch (e) {} });
}

// ?auto=1&frames=N：无头环境同步跑 N 帧，把状态打进 #report。
// 不能用 rAF —— 虚拟时钟下每一帧都请求下一帧，渲染进程会直接卡死。
// 包成函数是因为它要用到下面才定义的 VEIL（const 有 TDZ），必须等定义完再调。
function runAuto() {
  boot.style.display = 'none';
  running = true;
  try { S.unlock(); sea.init(); } catch (_) {}
  const N = Math.max(1, parseInt(Q.get('frames') || '600', 10));
  const autoMode = Q.get('auto');
  const drive = autoMode === 'drive';
  const jumpTest = autoMode === 'jump';
  let err = '';
  let maxV = 0;
  let minD = 9;
  const trace = Q.get('trace') === '1';
  const traceLines = [];
  try {
    for (let i = 0; i < N; i++) {
      // 自动驾驶：找一个同类 → 游过去 → 按住唱 → 没气就上浮。
      // 用来验证「一局到底」能不能真的走完（尤其最后一只够不着那条）。
      if (jumpTest) {
        // 真实的手只能指到水面（aimDepth>=0）；破水靠的是"把手指推过水面"
        // 这个动作（pullOut）换来的冲量。测试必须走同一条路，
        // 否则测的是"能不能贴到天花板"，不是"能不能真的跃出来"。
        game.aimDepth = 0;
        game.held = true;
        game.pullOut = true;
        if (!game._jumped) {
          game._jumped = true;
          game.depth = 0.45;
        }
      } else if (autoMode === 'idle') {
        // 不碰任何输入，只跑物理。用来验证"玩家还没动手的时候它不会自己跳"
        // —— v1.0.74 开局自动连跳就是靠这条抓出来的。
      } else if (drive && game.mode === 'play') {
        const m = game.mate;
        // 换气就换到八成满才走：只补一点点就下潜，会在浅处反复抽气，
        // 那是机器人的毛病，不是玩家的（人都会等到吸满）。
        if (game.oxy < 0.82 && (game.depth < 0.12 || game.oxy < 0.24)) {
          game.aimDepth = -0.04;
          game.aimLat = 0;
          game.held = false;
        } else if (m && !m.answered) {
          game.aimDepth += (m.depth - game.aimDepth) * 0.05;
          game.aimLat += (m.lat - game.aimLat) * 0.05;
          game.held = !!m.found;
          if (game.held && game.heldT < 0.5) game.heldT = 0.5;
        } else {
          game.held = false;
          game.aimDepth = Math.min(1, game.depth + 0.01);
        }
      }
      t += 1 / 60;
      game.update(1 / 60);
      maxV = Math.max(maxV, -game.vD);
      minD = Math.min(minD, game.depth);
      // ?trace=1：每 2 秒记一行。机器人卡住的时候，只有这条曲线能说清
      // 它到底是"没找到"（深度没到）、"上不来"（氧一直低）、还是"被挡"（深度不动）。
      if (trace && i % 120 === 0) {
        const nm = game.mates.find((x) => !x.answered);
        const nd = nm ? Math.hypot((nm.depth - game.depth) * 1.6, nm.lat - game.lat).toFixed(2) : '-';
        traceLines.push(`${(i / 60).toFixed(0)}s d=${game.depth.toFixed(2)} a=${game.aimDepth.toFixed(2)} v=${game.vD.toFixed(2)} o=${game.oxy.toFixed(2)} c=${game.codex.length} near=${nd} held=${game.held ? 1 : 0}`);
      }
      if (i % 4 === 0) { syncDom(); paintVeil(); }
    }
  } catch (e) {
    err = ` ERR ${e && e.message} @ ${((e && e.stack) || '').split('\n')[1] || ''}`;
  }
  try { r.frame(1 / 60, frameState()); } catch (e) { err += ` ERRFRAME ${e && e.message}`; }
  syncDom();
  paintVeil();
  const H = game.hud();
  // 取一个真实像素，确认画面不是被压成纯黑（截图肉眼看不出 #020a10 和 #000）
  let px0 = '';
  try {
    const d = r.ctx.getImageData(Math.floor(r.w * 0.5 * r.dpr), Math.floor(r.h * 0.3 * r.dpr), 1, 1).data;
    px0 = ` px=${d[0]},${d[1]},${d[2]}`;
  } catch (_) {}
  report.classList.add('on');
  report.textContent = `frames=${N} mode=${H.mode} depth=${H.depth.toFixed(2)} oxy=${H.oxygen.toFixed(2)} hp=${H.hp.toFixed(2)} scar=${H.scars} mut=${H.mut} ring=${H.rings} voices=${H.voices}/${H.voicesAll} codex=${H.codex} dives=${H.dives} dark=${H.dark.toFixed(2)} mates=[${game.mates.map(m=>m.depth.toFixed(2)+':'+(m.answered?'Y':(m.found?'n':'-'))).join(' ')}] kit=${game.kit.length} fish=${game.fish.length} gull=${game.gulls.length}${px0} maxV=${maxV.toFixed(2)} minD=${minD.toFixed(2)}${err}`;
  if (trace && traceLines.length) report.textContent += '\n' + traceLines.join('\n');
}

// ---------------- 循环 ----------------
const VEIL = {
  endA: (H) => ({
    t: '你回去了',
    d: `海面很亮。\n第 ${H.stage} 阶段的海，你看见了最后一眼。`,
    k: '「想替人世间　说一声抱歉」',
  }),
  endB: (H) => ({
    t: '最美丽的花园',
    // 两种死法，同一个花园。但死因不同，最后那句也该不同 ——
    // 气断是"没撑到"，血尽是"被这片海弄坏的"。
    d: H.deadReason === 'hp'
      ? '血散进水里，珊瑚把它接住了。\n它最后看见的，是第一层的样子。'
      : '珊瑚是彩色的，鱼群绕着你转。\n那是第一层的样子 —— 也是最后的样子。',
    k: '「还是说　有人类就无解」',
  }),
};

// ---------- DOM 写入的最小化 ----------
// 上一版 syncDom 每 4 帧无条件写 ~20 次 DOM（textContent / style / classList），
// 60fps 下等于每秒 300 次样式失效。手机上"画面不卡但动起来发涩"，
// 一半来自这里：主线程在算样式，合成器就得等。
// 现在每个元素记一份上次写过的值，值没变就一个字都不写 ——
// 氧气一秒才变一次，血条几秒才变一次，绝大多数帧是零写入。
const _dc = new WeakMap();
function domSet(el, key, value, apply) {
  let m = _dc.get(el);
  if (!m) { m = {}; _dc.set(el, m); }
  if (m[key] === value) return;
  m[key] = value;
  apply(value);
}

function syncDom() {
  const H = game.hud();
  // 结局时连"还剩多少秒"都不该留在屏幕上 —— 那时候已经没有秒了
  domSet(elHud, 'off', H.mode !== 'play', (v) => elHud.classList.toggle('off', v));
  // 只在标题页 / 结局给返回键；正在游的时候藏起来，免得手指误触
  domSet(elBack, 'on', H.mode !== 'play', (v) => elBack.classList.toggle('on', v));

  const waveTxt = `${H.strata}　·　${(H.depth / H.depthMax).toFixed(2)}`;
  domSet(elWave, 't', waveTxt, (v) => { elWave.textContent = v; });
  domSet(elOxy, 's', H.oxySec, (v) => { elOxy.innerHTML = `${v}<i>s</i>`; });
  domSet(elOxy, 'c', H.oxygen > 0.5 ? '#a6e7f7' : H.oxygen > 0.25 ? '#ffcf7a' : '#ff8a76',
    (v) => { elOxy.style.color = v; });

  // 血条：只有失血才动。扣到 1/3 以下整条转暗红。
  // 闪一下用 CSS 动画 + 强制重排重触发，不另建定时器（后台标签页里定时器会漂）。
  domSet(elHpBar, 'w', Math.round(H.hp * 1000), (v) => { elHpBar.style.width = (v / 10).toFixed(1) + '%'; });
  domSet(elHp, 'low', H.hp < 0.34, (v) => elHp.classList.toggle('low', v));
  const hpNow = Math.round(H.hp * 1000);
  if (hpNow < lastHp - 1 && H.mode === 'play') {
    elHp.classList.remove('hit');
    void elHp.offsetWidth;
    elHp.classList.add('hit');
  }
  lastHp = hpNow;

  // 歌：七个点。每回应一只亮一个。这是唯一的进度条。
  // 只在声部数变化时动 DOM（进度不变时每 4 帧重刷 7 个 class 是白烧的）。
  domSet(elNotes, 'v', H.voices, (v) => {
    while (elNotes.childElementCount < H.voicesAll) elNotes.appendChild(document.createElement('i'));
    for (let i = 0; i < elNotes.childElementCount; i++) {
      elNotes.children[i].classList.toggle('on', i < v);
    }
  });

  const bandOn = H.band !== 'mid';
  const bandTxt = H.band === 'surface'
    ? (!H.atAir ? '水面 · 再上去一点才够得着空气'
      : game.kit.some((k) => k.type === 'slick') ? '水面 · 油污里，你最显眼' : '水面 · 能被看见')
    : H.band === 'abyss' ? '深渊 · 它看不见你，你也看不见路' : '';
  domSet(elBand, 'on', bandOn, (v) => elBand.classList.toggle('on', v));
  domSet(elBand, 't', bandTxt, (v) => { elBand.textContent = v; });

  const hint = H.mode === 'play' ? H.hint : '';
  domSet(elHint, 't', hint, (v) => { elHint.textContent = v; });
  domSet(elHint, 'on', !!hint, (v) => elHint.classList.toggle('on', v));

  // 目标行。核心循环是呼吸：潜下去待着，气不够就上来。
  // 同类的歌只是顺路的事 —— 它响的时候提一句，不响就不提。
  let objTxt = '';
  let objColor = '#86b3c6';
  if (H.mode === 'play') {
    if (H.mateFound) { objTxt = '它就在这 · 长按，回应'; objColor = '#e8c07a'; }
    else if (H.hp < 0.26) { objTxt = '血快没了 · 别再碰钩子和塑料'; objColor = '#ff8a76'; }
    else if (H.oxygen < 0.24) { objTxt = '气不够了 · 往上滑，把头探出去'; objColor = '#ff9a86'; }
    else if (H.band === 'surface') { objTxt = '换完了就走 · 下面才是家'; objColor = '#a6c8d8'; }
    else if (H.blood > 0) { objTxt = '你在流血 · 海鸥看见了'; objColor = '#d8988a'; }
    // 目标行永远带一个分母：这是"流程清不清晰"的答案。
    // 上一版只写"找到同伴"，玩家不知道要找几只、找了几个。
    else { objTxt = `同伴 ${H.codex}/${H.codexAll} · 往下找`; objColor = '#86b3c6'; }
  }
  domSet(elObj, 't', objTxt, (v) => { elObj.textContent = v; });
  domSet(elObj, 'c', objColor, (v) => { elObj.style.color = v; });

  // 开场三步：只教三个动作。4 秒一条，13 秒后彻底退场。
  const tutOn = H.mode === 'play' && game.t < 13;
  domSet(elTut, 'on', tutOn, (v) => elTut.classList.toggle('on', v));
  if (tutOn) {
    const k = Math.min(2, Math.floor(game.t / 4));
    domSet(elTut, 'k', k, (v) => {
      for (let i = 0; i < tutSteps.length; i++) tutSteps[i].classList.toggle('on', i === v);
    });
  }

  // 跨入新的一段时给一次歌词。它不是标语，所以只挂 2.8 秒。
  if (H.strata !== lastStrata) {
    lastStrata = H.strata;
    lyricT = 3.0;
    const [tEl, dEl] = elLyric.children;
    const S = SEA_STRATA[H.strataIdx - 1] || SEA_STRATA[0];
    tEl.textContent = S.line;
    dEl.textContent = H.strata;
  }
  lyricT = Math.max(0, lyricT - 0.06);
  domSet(elLyric, 'on', H.mode === 'play' && lyricT > 0, (v) => elLyric.classList.toggle('on', v));

  // 长按进度：回应同类 / 献祭项链
  let prog = 0;
  if (H.mode === 'play') {
    if (H.mateFound) prog = H.mateResp;
    else if (H.canSacrifice) prog = H.sacrifice;
  }
  domSet(elProg, 'on', prog > 0.01, (v) => elProg.classList.toggle('on', v));
  domSet(elProgBar, 'w', Math.round(prog * 200), (v) => { elProgBar.style.width = (v / 2).toFixed(1) + '%'; });
  domSet(elProgBar, 'bg', H.mateFound ? '#8fd8ec' : '#e8c07a', (v) => { elProgBar.style.background = v; });

  if (H.mode === 'play') {
    if (endShown) { elVeil.classList.remove('on'); endShown = ''; }
  } else if (H.mode === 'endA' && endShown !== 'endA') {
    endShown = 'endA';
    markSeen();
  } else if (H.mode === 'endB' && endShown !== 'endB' && H.dark > 0.10) {
    endShown = 'endB';
    markSeen();
  }
}

/**
 * 看过结局 = 第五关上篇通关。
 * 只写一个布尔标记（不碰主存档那个数字进度）：主界面的选关面板据此给
 * 「第 5 关 · 上」打「已通关」记号。写失败也无所谓 —— 那只是个小记号。
 */
function markSeen() {
  try { localStorage.setItem('hold-the-bridge:sea', '1'); } catch (_) {}
}

function paintVeil() {
  const H = game.hud();
  if (H.mode === 'play') return;
  const v = VEIL[H.mode] && VEIL[H.mode](H);
  if (!v) return;
  const [tEl, dEl, kEl] = elVeil.children;
  if (tEl.textContent !== v.t) {
    tEl.textContent = v.t;
    dEl.textContent = v.d || '';
    kEl.textContent = v.k || '';
    elVeil.classList.add('on');
  }
}

function loop(now) {
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
  last = now;
  t += dt;
  frames++;

  game.update(dt);
  sea.update(dt, { depth: game.depth, oxygen: game.oxy });
  r.frame(dt, frameState());

  if (frames % 4 === 0) { syncDom(); paintVeil(); }
  // endB 的暗场是渐变的，文字得跟着一起浮上来
  if (game.mode === 'endB' && game.dark > 0.10 && elVeil.classList.contains('on') === false) paintVeil();

  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.5) { fpsShown = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(loop);
}

// ---------------- 输入 ----------------
function start() {
  boot.style.display = 'none';
  running = true;
  S.unlock();
  const ok = sea.init();
  if (!ok) setTimeout(() => sea.init(), 120);
  sea.motif({ vol: 0.04 });
  // 真实录音异步加载：不挡开局，到位了再接上海面环境层
  sea.loadSamples().then((got) => {
    if (got) sea.startSurfaceBed();
  });
  requestAnimationFrame(loop);
}

boot.addEventListener('pointerdown', start);

cv.addEventListener('pointerdown', (e) => {
  if (!running) return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  game.down(e.clientX, e.clientY);
});
cv.addEventListener('pointermove', (e) => {
  if (!running) return;
  game.move(e.clientX, e.clientY);
});
const release = () => { if (running) game.up(); };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', release);

// 键鼠调试：空格 = 唱，方向键 = 游
window.addEventListener('keydown', (e) => {
  if (!running) return;
  if (e.code === 'Space') { e.preventDefault(); if (!game.held) game.down(r.w * 0.5, r.h * 0.5); }
  if (e.code === 'ArrowUp') game.aimDepth = clamp(game.aimDepth - 0.03, 0, 1);
  if (e.code === 'ArrowDown') game.aimDepth = clamp(game.aimDepth + 0.03, 0, 1);
  if (e.code === 'ArrowLeft') game.aimLat = clamp(game.aimLat - 0.04, -1, 1);
  if (e.code === 'ArrowRight') game.aimLat = clamp(game.aimLat + 0.04, -1, 1);
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space') game.up();
});

window.__SEA = { r, sea, S, QUALITY, game, state: () => ({ mode: game.mode, depth: game.depth, oxy: game.oxy, voices: game.voices, frames }) };

if (Q.get('auto')) runAuto();
</script>
</body>
</html>
